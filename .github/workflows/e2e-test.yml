name: E2E Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  e2e-test:
    name: Node.js
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x"]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Cypress
        run: npx cypress install

      - name: Verificar Cypress
        run: npx cypress verify

      - name: Iniciar MongoDB
        run: |
          docker run -d -p 27017:27017 mongo:4.0
          timeout 60s bash -c 'until nc -z localhost 27017; do sleep 2; done'

      - name: Ejecutar pruebas E2E
        run: |
          NODE_ENV=test npm start -- --silent &
          npm run test:ci -- --config video=true
